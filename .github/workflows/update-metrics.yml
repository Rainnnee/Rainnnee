name: Update public profile metrics

on:
  workflow_dispatch:
  schedule:
    # Monday 15:23 UTC. GitHub may delay scheduled jobs.
    - cron: "23 15 * * 1"

permissions:
  contents: write

concurrency:
  group: public-profile-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Refresh public metrics and cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/collect_metrics.py

      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- README.md assets/consistency.svg assets/evidence.svg data/metrics.json data/history.json; then
            echo "No metric changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/consistency.svg assets/evidence.svg data/metrics.json data/history.json
          git commit -m "chore: refresh public profile metrics"
          git push
