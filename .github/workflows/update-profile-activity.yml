name: Refresh profile activity card

on:
  workflow_dispatch:
  schedule:
    # Weekly refresh; GitHub may delay scheduled workflow starts.
    - cron: "23 15 * * 1"

permissions:
  contents: write

concurrency:
  group: profile-activity-card
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate the contribution calendar card
        run: python3 scripts/update_profile_activity.py

      - name: Commit refreshed public calendar
        run: |
          if git diff --quiet -- assets/github-activity.svg data/profile-activity.json; then
            echo "No profile activity changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity.svg data/profile-activity.json
          git commit -m "chore: refresh profile activity card"
          git push
