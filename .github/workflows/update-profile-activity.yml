name: Refresh GitHub activity

on:
  workflow_dispatch:
  schedule:
    # Avoid the top of the hour; GitHub can still delay scheduled jobs.
    - cron: "17 * * * *"
  push:
    branches: [main, "profile/**"]
    paths:
      - README.md
      - scripts/update_profile_activity.py
      - data/language-colors.json
      - tests/test_profile_activity.py
      - .github/workflows/update-profile-activity.yml

permissions:
  contents: write

concurrency:
  group: profile-activity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check data handling and rendering
        run: python3 -m unittest discover -s tests -p test_profile_activity.py

      - name: Refresh public GitHub data and both image themes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile_activity.py

      - name: Publish refreshed images
        run: |
          git add assets/github-*.svg data/profile-activity.json data/github-stats.json
          if git diff --cached --quiet; then
            echo "No activity changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh GitHub activity"
          git push origin "HEAD:${GITHUB_REF_NAME}"
